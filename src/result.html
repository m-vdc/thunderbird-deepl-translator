<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traduction DeepL</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #e0e0e0;
      flex: 0 0 auto;
    }
    header img { width: 24px; height: 24px; }
    header h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
    header .hint { font-size: 11px; color: #999; }

    main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      min-height: 0;
    }
    .block {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .block.source { flex: 0 0 32%; }
    .block.target { flex: 1 1 auto; }
    label {
      font-weight: 500;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
      flex: 0 0 auto;
    }
    textarea {
      flex: 1 1 auto;
      width: 100%;
      min-height: 60px;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.45;
      resize: none;
      overflow-y: auto;
    }
    textarea:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 2px rgba(25,118,210,.1); }

    .toolbar { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-primary:disabled { background: #90caf9; cursor: not-allowed; }
    .status-inline { font-size: 11px; color: #888; }

    #resultText {
      flex: 1 1 auto;
      background: #f6f8fa;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-y: auto;
      user-select: text;
      min-height: 80px;
    }
    #resultText.placeholder { color: #aaa; font-style: italic; }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .error.hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="DeepL">
    <h1>Traduction DeepL</h1>
    <span class="hint">texte sélectionnable — Ctrl+C pour copier</span>
  </header>

  <main>
    <div class="block source">
      <label>Texte à traduire</label>
      <textarea id="sourceText" placeholder="Le texte sélectionné dans le message apparaît ici. Vous pouvez le modifier ou en coller un autre."></textarea>
    </div>

    <div class="toolbar">
      <button id="translateBtn" class="btn-primary">Traduire en français</button>
      <span class="status-inline" id="statusInline"></span>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="block target">
      <label>Traduction (français)</label>
      <div id="resultText" class="placeholder">La traduction s'affichera ici.</div>
    </div>
  </main>

  <script src="result.js"></script>
</body>
</html>
