<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepL Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      padding: 16px;
      margin: 0;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .header img { width: 32px; height: 32px; }
    .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 12px;
    }
    .status.connected { background: #e8f5e9; color: #2e7d32; }
    .status.disconnected { background: #fff3e0; color: #e65100; }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: currentColor;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 12px;
      color: #333;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #1976d2;
      color: white;
    }
    .btn-primary:hover { background: #1565c0; }
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
    }
    .btn-secondary:hover { background: #eee; }
    .result-area {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }
    .result-area.hidden { display: none; }
    .result-label {
      font-size: 12px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
    }
    .result-text {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .actions button { flex: 1; }
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #1976d2;
      text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .error.hidden { display: none; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-primary:disabled { background: #90caf9; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="DeepL">
    <h1>DeepL Translator</h1>
  </div>

  <div id="status" class="status disconnected">
    <span class="dot"></span>
    <span id="statusText">Clé API non configurée</span>
  </div>

  <div id="error" class="error hidden"></div>

  <div class="input-group">
    <label>Texte à traduire</label>
    <textarea id="sourceText" placeholder="Sélectionnez du texte dans un email, ou collez-le ici..."></textarea>
  </div>

  <div class="btn-group">
    <button id="translateBtn" class="btn-primary">
      <span id="btnText">Traduire en français</span>
    </button>
    <button id="getSelectionBtn" class="btn-secondary" title="Récupérer la sélection dans l'email">
      📋 Sélection
    </button>
  </div>

  <div id="resultArea" class="result-area hidden">
    <div class="result-label">Traduction (Français)</div>
    <div id="resultText" class="result-text"></div>
    <div class="actions">
      <button id="copyBtn" class="btn-secondary">📋 Copier</button>
      <button id="replaceBtn" class="btn-primary">Remplacer</button>
    </div>
  </div>

  <a href="#" id="settingsLink" class="settings-link">⚙️ Configurer la clé API DeepL</a>

  <script src="popup.js"></script>
</body>
</html>
