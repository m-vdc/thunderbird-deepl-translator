<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepL Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      padding: 16px;
      margin: 0;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }
    .header img { width: 28px; height: 28px; }
    .header h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
    .header .ver { font-size: 11px; color: #999; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status.connected { background: #e8f5e9; color: #2e7d32; }
    .status.disconnected { background: #fff3e0; color: #e65100; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .input-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 12px; color: #333; }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 9px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 2px rgba(25,118,210,.1); }
    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary { background: #1976d2; color: #fff; }
    .btn-primary:hover { background: #1565c0; }
    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-secondary:hover { background: #eee; }
    .btn-primary:disabled { background: #90caf9; cursor: not-allowed; }
    .result-area { margin-top: 14px; padding-top: 10px; border-top: 1px solid #e0e0e0; }
    .result-area.hidden { display: none; }
    .result-label { font-size: 12px; font-weight: 500; color: #666; margin-bottom: 5px; }
    .result-text {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      user-select: text;
    }
    .result-actions { margin-top: 8px; }
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #1976d2;
      text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }
    .error {
      background: #ffebee;
      color: #c62828;
      padding: 9px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .error.hidden { display: none; }
    .diag {
      margin-top: 10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1.4;
      color: #666;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 6px 8px;
      max-height: 90px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .diag.hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon32.png" alt="DeepL">
    <h1>DeepL Translator</h1>
    <span class="ver" id="versionLabel"></span>
  </div>

  <div id="status" class="status disconnected">
    <span class="dot"></span>
    <span id="statusText">Clé API non configurée</span>
  </div>

  <div id="error" class="error hidden"></div>

  <div class="input-group">
    <label>Texte à traduire</label>
    <textarea id="sourceText" placeholder="Le texte sélectionné dans le message apparaît ici automatiquement. Vous pouvez aussi le coller."></textarea>
  </div>

  <div class="btn-group">
    <button id="translateBtn" class="btn-primary">Traduire en français</button>
  </div>

  <div id="resultArea" class="result-area hidden">
    <div class="result-label">Traduction (français)</div>
    <div id="resultText" class="result-text"></div>
    <div class="result-actions">
      <button id="windowBtn" class="btn-secondary">Ouvrir dans une fenêtre</button>
    </div>
  </div>

  <a href="#" id="settingsLink" class="settings-link">Configurer la clé API DeepL</a>

  <div id="diag" class="diag hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
